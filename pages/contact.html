<form id="contact-form">

    <input
    type="text"
    id="name"
    placeholder="Full Name"
    required>

    <input
    type="email"
    id="email"
    placeholder="Email Address"
    required>

    <textarea
    id="message"
    rows="6"
    placeholder="Your Message"
    required></textarea>

    <button
    class="btn"
    type="submit">

        Send Message

    </button>

</form>
<section class="map">

<iframe
src="https://www.google.com/maps?q=Nairobi,Kenya&output=embed"
width="100%"
height="400"
style="border:0;"
allowfullscreen=""
loading="lazy">
</iframe>

</section>

<p id="success-message"></p>
