<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Modern Farms API Test</title>
</head>

<body>

<h1>Modern Farms API Test</h1>

<button id="testButton">
    Load Products
</button>

<pre id="output">
Waiting...
</pre>

<script src="/frontend/js/api.js"></script>

<script>

document
    .getElementById("testButton")
    .addEventListener("click", async () => {

        const output =
            document.getElementById("output");

        try {

            const response =
                await ModernFarmsAPI.getProducts();

            output.textContent =
                JSON.stringify(
                    response,
                    null,
                    2
                );

        } catch (error) {

            output.textContent =
                "ERROR: " + error.message;

        }

    });

</script>

</body>

</html>
